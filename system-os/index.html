<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#050810" />
<meta name="description" content="Turn your life into a game: daily quests, XP, levels, ranks. 180 minutes a day. نظام حياة على شكل لعبة." />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>THE SYSTEM — Life OS</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="assets/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Inter:wght@400;500;600&family=Orbitron:wght@700;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="bg-glow g1"></div>
    <div class="bg-glow g2"></div>
    <div class="bg-grid"></div>
    <div class="bg-scan"></div>
  </div>

  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-glyph">⬡</span>
        <span class="brand-text">SYSTEM</span>
      </div>
      <div class="hud">
        <div class="hud-chip"><span class="k">LV</span><b id="hudLevel">1</b></div>
        <div class="hud-chip streak-chip"><span class="g">🔥</span><b id="hudStreak">0</b></div>
        <button class="icon-btn" id="langBtn" type="button" aria-label="Language">EN</button>
      </div>
    </header>

    <main id="view" class="view"></main>

    <nav class="nav" id="nav" aria-label="Main"></nav>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="modalRoot" class="modal-root"></div>
  <input type="file" id="importFile" accept=".json,application/json" hidden />

  <noscript>
    <div style="padding:24px;text-align:center">This app needs JavaScript. / هذا التطبيق يحتاج JavaScript.</div>
  </noscript>

  <script src="js/i18n.js"></script>
  <script src="js/config.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/core.js"></script>
  <script src="js/views.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/debug.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
